<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okeho Mapping — Admin Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        #map { width: 100%; height: 100vh; }

        /* Login overlay */
        .login-overlay {
            position: fixed; inset: 0; z-index: 3000;
            background: #1a1a2e; display: flex; align-items: center; justify-content: center;
        }
        .login-box {
            background: white; border-radius: 12px; padding: 32px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2); width: 340px; text-align: center;
        }
        .login-box h1 { font-size: 20px; margin-bottom: 4px; color: #1a1a1a; }
        .login-box p { font-size: 13px; color: #888; margin-bottom: 20px; }
        .login-box input {
            width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px;
            font-size: 14px; margin-bottom: 12px;
        }
        .login-box button {
            width: 100%; padding: 10px; background: #1E7D3B; color: white; border: none;
            border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 500;
        }
        .login-box button:hover { background: #1565C0; }
        .login-box .error { color: #D32F2F; font-size: 13px; margin-top: 8px; display: none; }

        /* Sidebar */
        .sidebar {
            position: fixed; top: 0; right: 0; width: 340px; height: 100vh;
            background: white; box-shadow: -2px 0 8px rgba(0,0,0,0.1);
            z-index: 1000; overflow-y: auto; padding: 16px;
            transform: translateX(100%); transition: transform 0.3s ease;
        }
        .sidebar.open { transform: translateX(0); }
        .sidebar h2 { font-size: 18px; margin-bottom: 12px; color: #1a1a1a; }
        .sidebar .close-btn {
            position: absolute; top: 12px; right: 12px; background: none;
            border: none; font-size: 24px; cursor: pointer; color: #666;
        }
        .sidebar .detail-row { margin-bottom: 8px; }
        .sidebar .detail-label { font-size: 12px; color: #888; text-transform: uppercase; }
        .sidebar .detail-value { font-size: 14px; color: #1a1a1a; }
        .sidebar img {
            width: 100%; border-radius: 8px; margin-top: 8px;
            max-height: 300px; object-fit: cover;
        }

        /* Controls */
        .controls {
            position: fixed; top: 12px; left: 60px; z-index: 1000;
            background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            padding: 8px 12px; display: flex; gap: 8px; align-items: center;
        }
        .controls label { font-size: 13px; color: #555; }
        .controls select {
            padding: 4px 8px; border: 1px solid #ddd; border-radius: 4px;
            font-size: 13px; background: white;
        }
        .controls .count { font-size: 12px; color: #888; margin-left: 8px; }

        /* Legend */
        .legend {
            position: fixed; bottom: 24px; left: 12px; z-index: 1000;
            background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            padding: 10px 14px; font-size: 12px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
        .legend-item:last-child { margin-bottom: 0; }
        .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
        .legend-line { width: 20px; height: 3px; border-radius: 2px; }

        .loading {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 2000; font-size: 16px; color: #666;
        }
    </style>
</head>
<body>
    <!-- Login overlay -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h1>Okeho Mapping</h1>
            <p>Admin Dashboard</p>
            <input type="password" id="adminPassword" placeholder="Admin password" autofocus>
            <button onclick="login()">Sign In</button>
            <div class="error" id="loginError">Invalid password</div>
        </div>
    </div>

    <!-- Dashboard (hidden until auth) -->
    <div class="controls" id="controls" style="display:none">
        <label>Feature:</label>
        <select id="filterType">
            <option value="all">All</option>
            <option value="business">Business</option>
            <option value="landmark">Landmark</option>
            <option value="school">School</option>
            <option value="health_facility">Health Facility</option>
            <option value="building">Building</option>
            <option value="transport">Transport</option>
            <option value="road_feature">Road Feature</option>
            <option value="other">Other</option>
        </select>
        <span class="count" id="stats"></span>
    </div>

    <div class="legend" id="legend" style="display:none">
        <div class="legend-item"><div class="legend-dot" style="background:#2979FF"></div> Capture (point)</div>
        <div class="legend-item"><div class="legend-line" style="background:#2E7D32"></div> Street (paved)</div>
        <div class="legend-item"><div class="legend-line" style="background:#8D6E63"></div> Street (unpaved)</div>
    </div>

    <div class="sidebar" id="sidebar">
        <button class="close-btn" onclick="closeSidebar()">&times;</button>
        <div id="sidebarContent"></div>
    </div>

    <div class="loading" id="loading" style="display:none">Loading data…</div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
    // ─── CONFIG ───────────────────────────────────────────────────────
    // Edge Function URL — replace with your Supabase project ref
    const FUNCTION_URL = 'https://pvyxvffbwujtxbfqngvw.supabase.co/functions/v1/admin-data';
    let authToken = '';

    // ─── MAP ──────────────────────────────────────────────────────────
    const map = L.map('map').setView([8.03, 3.70], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 19
    }).addTo(map);

    let captureLayer = L.layerGroup().addTo(map);
    let streetLayer = L.layerGroup().addTo(map);
    let allCaptures = [];
    let allStreets = [];

    // ─── AUTH ─────────────────────────────────────────────────────────
    async function login() {
        const pw = document.getElementById('adminPassword').value;
        if (!pw) return;

        authToken = pw;
        try {
            const res = await fetch(FUNCTION_URL, {
                headers: { 'Authorization': 'Bearer ' + pw }
            });
            if (res.status === 401) {
                document.getElementById('loginError').style.display = 'block';
                return;
            }
            if (!res.ok) throw new Error('Server error');

            // Auth succeeded — show dashboard
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('controls').style.display = 'flex';
            document.getElementById('legend').style.display = 'block';
            document.getElementById('loading').style.display = 'block';

            const data = await res.json();
            allCaptures = data.captures || [];
            allStreets = data.streets || [];

            document.getElementById('loading').style.display = 'none';
            renderAll();
            fitBounds();
        } catch (e) {
            document.getElementById('loginError').textContent = 'Connection failed';
            document.getElementById('loginError').style.display = 'block';
        }
    }

    // Enter key to login
    document.getElementById('adminPassword').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') login();
    });

    // ─── RENDER ───────────────────────────────────────────────────────
    function renderAll() {
        const typeFilter = document.getElementById('filterType').value;

        captureLayer.clearLayers();
        streetLayer.clearLayers();

        let capCount = 0;
        allCaptures.forEach(c => {
            if (typeFilter !== 'all' && c.feature_type !== typeFilter) return;
            const coords = parseGeoJson(c.geometry);
            if (!coords) return;

            const marker = L.circleMarker(coords, {
                radius: 7, fillColor: '#2979FF', color: '#fff',
                weight: 2, fillOpacity: 0.85
            });
            marker.on('click', () => showCaptureDetails(c));
            captureLayer.addLayer(marker);
            capCount++;
        });

        let strCount = 0;
        allStreets.forEach(s => {
            const coords = parseLineString(s.geometry);
            if (!coords || coords.length < 2) return;

            const color = s.surface_type === 'paved' ? '#2E7D32' : '#8D6E63';
            const polyline = L.polyline(coords, { color, weight: 4, opacity: 0.8 });
            polyline.on('click', () => showStreetDetails(s));
            streetLayer.addLayer(polyline);
            strCount++;
        });

        document.getElementById('stats').textContent = `${capCount} captures · ${strCount} streets`;
    }

    function fitBounds() {
        const allCoords = [];
        allCaptures.forEach(c => { const pt = parseGeoJson(c.geometry); if (pt) allCoords.push(pt); });
        allStreets.forEach(s => { const ls = parseLineString(s.geometry); if (ls) allCoords.push(...ls); });
        if (allCoords.length > 0) map.fitBounds(allCoords, { padding: [40, 40] });
    }

    // ─── GEOMETRY PARSERS ─────────────────────────────────────────────
    function parseGeoJson(geo) {
        if (!geo || !geo.coordinates) return null;
        if (geo.type === 'Point') return [geo.coordinates[1], geo.coordinates[0]];
        return null;
    }

    function parseLineString(geo) {
        if (!geo || !geo.coordinates) return null;
        if (geo.type === 'LineString') return geo.coordinates.map(c => [c[1], c[0]]);
        return null;
    }

    // ─── SIDEBAR ──────────────────────────────────────────────────────
    function openSidebar(html) {
        document.getElementById('sidebarContent').innerHTML = html;
        document.getElementById('sidebar').classList.add('open');
    }

    function closeSidebar() {
        document.getElementById('sidebar').classList.remove('open');
    }

    function showCaptureDetails(c) {
        const photoHtml = c.photo_signed_url
            ? `<img src="${c.photo_signed_url}" alt="Photo">`
            : '';
        const ts = c.created_at ? new Date(c.created_at).toLocaleString() : '—';
        openSidebar(`
            <h2>${c.name || 'Unnamed Capture'}</h2>
            <div class="detail-row"><div class="detail-label">Feature Type</div><div class="detail-value">${c.feature_type || '—'}</div></div>
            <div class="detail-row"><div class="detail-label">Accuracy</div><div class="detail-value">${c.accuracy ? c.accuracy.toFixed(1) + ' m' : '—'}</div></div>
            <div class="detail-row"><div class="detail-label">Created</div><div class="detail-value">${ts}</div></div>
            ${c.ocr_text ? `<div class="detail-row"><div class="detail-label">OCR Text</div><div class="detail-value">${c.ocr_text}</div></div>` : ''}
            ${photoHtml}
        `);
    }

    function showStreetDetails(s) {
        const ts = s.created_at ? new Date(s.created_at).toLocaleString() : '—';
        openSidebar(`
            <h2>${s.name || 'Unnamed Street'}</h2>
            <div class="detail-row"><div class="detail-label">Surface</div><div class="detail-value">${s.surface_type || '—'}</div></div>
            <div class="detail-row"><div class="detail-label">Traffic</div><div class="detail-value">${s.traffic_direction || '—'}</div></div>
            <div class="detail-row"><div class="detail-label">Points Captured</div><div class="detail-value">${s.points_captured || '—'}</div></div>
            <div class="detail-row"><div class="detail-label">Created</div><div class="detail-value">${ts}</div></div>
        `);
    }

    // ─── FILTER ───────────────────────────────────────────────────────
    document.getElementById('filterType').addEventListener('change', async () => {
        const typeFilter = document.getElementById('filterType').value;
        const url = typeFilter === 'all' ? FUNCTION_URL : `${FUNCTION_URL}?feature_type=${typeFilter}`;
        try {
            const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + authToken } });
            if (!res.ok) return;
            const data = await res.json();
            allCaptures = data.captures || [];
            allStreets = data.streets || [];
            renderAll();
        } catch (e) { /* silent */ }
    });
    </script>
</body>
</html>
